name: 功能建议
description: 提出新的功能或改进建议
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: 建议内容
      description: 请描述你希望增加或改进的功能。
      placeholder: 我希望……
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 这个功能会在什么情况下帮助你？
      placeholder: 当我……时，希望能够……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果有其他解决方式，也可以写在这里。
